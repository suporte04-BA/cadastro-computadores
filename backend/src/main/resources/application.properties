# ===== APP CONFIG =====
server.port=3030
server.address=0.0.0.0
spring.application.name=cadastro-computadores

# ===== STARTUP OPTIMIZATION =====
spring.main.lazy-initialization=false
spring.main.allow-bean-definition-overriding=true
spring.jpa.open-in-view=false

# ===== DATABASE (H2) =====
spring.datasource.url=jdbc:h2:file:./data/inventario_db;AUTO_SERVER=TRUE
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.connection-timeout=5000

# ===== H2 CONSOLE =====
spring.h2.console.enabled=false

# ===== JPA =====
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.jdbc.batch_size=20
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true

# ===== JWT =====
app.jwt.secret=cadastro-computadores-secret-key-muito-segura-para-producao-2024-spring-boot-jwt
app.jwt.expiration=1800000
app.jwt.refresh-expiration=2592000000

# ===== SWAGGER =====
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs
springdoc.api-docs.enabled=false
springdoc.swagger-ui.enabled=false

# ===== ACTUATOR =====
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=when-authorized

# ===== FILE UPLOAD =====
spring.servlet.multipart.max-file-size=100MB
spring.servlet.multipart.max-request-size=100MB
spring.servlet.multipart.file-size-threshold=2KB
app.upload.dir=uploads
app.upload.max-size=104857600

# ===== STATIC RESOURCES =====
spring.web.resources.add-mappings=false
spring.web.resources.static-locations=classpath:/static/
